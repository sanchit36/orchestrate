[package]
name = "orchestrate"
version = "0.1.0"
edition = "2024"
description = "Run a spec's tickets through Claude Code sessions and merge the results"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sanchit36/orchestrate"
homepage = "https://github.com/sanchit36/orchestrate"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"
jiff = "0.2.38"
notify-rust = "4.18.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "0.4.5"
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
